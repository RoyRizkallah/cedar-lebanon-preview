<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1c1c" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="description" content="Cedar Rehab — staff workspace for leads, admissions, clinical and fitness records." />
    <title>Cedar Rehab</title>
    <script>
      // Apply the saved or system theme before the first paint, so there is no flash.
      try { const t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('cedar-theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
